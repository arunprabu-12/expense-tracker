<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Make Payment - Student Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .pay-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .pay-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .balance-header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.1) 0%, rgba(37, 99, 235, 0.1) 100%);
      border-radius: 16px;
      border: 2px solid rgba(15, 118, 110, 0.2);
    }

    .balance-label {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .balance-display {
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary);
      margin: 0;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .category-button {
      padding: 16px 12px;
      border: 2px solid transparent;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-transform: capitalize;
      color: #fff;
      font-size: 1.1rem;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .category-button.food {
      background: linear-gradient(135deg, #ff9500 0%, #ff7200 100%);
      box-shadow: 0 4px 15px rgba(255, 149, 0, 0.3);
    }

    .category-button.transport {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .category-button.books {
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .category-button.shopping {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .category-button.other {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .category-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .category-button.active {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .category-button:active {
      transform: scale(0.98);
    }

    .amount-section {
      margin-bottom: 24px;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .amount-button {
      padding: 14px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--primary);
    }

    .amount-button:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-2px);
    }

    .amount-button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
    }

    .custom-amount-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .custom-amount-group input {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
    }

    .custom-amount-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-pay {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, #0b5f59 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(15, 118, 110, 0.3);
    }

    .btn-pay:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4);
    }

    .btn-pay:active {
      transform: translateY(0);
    }

    .btn-pay:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-back {
      padding: 14px 24px;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--line);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-2px);
    }

    .success-message {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
      font-size: 1.3rem;
      font-weight: 800;
      z-index: 100;
      text-align: center;
      animation: slideInScale 0.4s ease-out;
    }

    @keyframes slideInScale {
      from {
        opacity: 0;
        transform: translate(-50%, -60%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-box {
      background: rgba(15, 118, 110, 0.1);
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #065f58;
    }

    @media (max-width: 768px) {
      .pay-card {
        padding: 20px;
      }

      .balance-display {
        font-size: 2.2rem;
      }

      .categories-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .amount-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-buttons {
        flex-direction: column;
      }

      .category-button {
        min-height: 70px;
      }
    }

    @media (max-width: 480px) {
      .pay-container {
        padding: 12px;
      }

      .pay-card {
        padding: 16px;
        border-radius: 16px;
      }

      .balance-display {
        font-size: 1.8rem;
      }

      .categories-grid {
        grid-template-columns: 1fr;
      }

      .amount-grid {
        grid-template-columns: 1fr;
      }

      .custom-amount-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>💳 Make a Payment</h1>
    <div class="header-actions">
      <a href="student-dashboard.html" class="btn btn-ghost">Back to Wallet</a>
      <span id="userBadge"></span>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <main class="pay-container">
    <div class="pay-card">
      <div class="balance-header">
        <div class="balance-label">Available Balance</div>
        <p class="balance-display" id="walletBalance">₹0.00</p>
      </div>

      <div class="info-box">
        ℹ️ Select a category, choose an amount, and complete your payment instantly.
      </div>

      <!-- Category Selection -->
      <div class="amount-section">
        <h3 class="section-title">📂 Select Category</h3>
        <div class="categories-grid" id="categoriesContainer">
          <button class="category-button food" data-category="Food">🍔 Food</button>
          <button class="category-button transport" data-category="Transport">🚗 Transport</button>
          <button class="category-button books" data-category="Books">📚 Books</button>
          <button class="category-button shopping" data-category="Shopping">🛍️ Shopping</button>
          <button class="category-button other" data-category="Other">📝 Other</button>
        </div>
      </div>

      <!-- Amount Selection -->
      <div class="amount-section">
        <h3 class="section-title">💰 Select or Enter Amount</h3>
        <div class="amount-grid" id="amountGrid">
          <button class="amount-button" data-amount="50">₹50</button>
          <button class="amount-button" data-amount="100">₹100</button>
          <button class="amount-button" data-amount="200">₹200</button>
          <button class="amount-button" data-amount="500">₹500</button>
          <button class="amount-button" data-amount="1000">₹1000</button>
        </div>
        <div class="custom-amount-group">
          <input 
            type="number" 
            id="customAmount" 
            placeholder="Enter custom amount..." 
            min="1" 
            step="0.01"
          />
        </div>
      </div>

      <!-- Summary -->
      <div class="info-box" id="paymentSummary" style="display: none;">
        <strong>Summary:</strong><br>
        Category: <span id="summaryCategory">-</span><br>
        Amount: <span id="summaryAmount">-</span>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn-pay" id="payButton" disabled>
          <span id="payButtonText">Complete Payment</span>
        </button>
        <button class="btn-back" onclick="goBack()">← Back</button>
      </div>
    </div>
  </main>

  <!-- Success Message -->
  <div class="overlay" id="overlay"></div>
  <div class="success-message" id="successMessage">
    ✅ Payment Successful!<br>
    <small id="successDetails" style="font-size: 0.8em; opacity: 0.9;"></small>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pay.js"></script>

  <script>
    function goBack() {
      window.location.href = "student-dashboard.html";
    }
  </script>
</body>
</html>
