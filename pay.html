<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Make a Payment</h1>
    <div class="header-actions">
      <a href="student-dashboard.html" class="btn btn-ghost">Student Wallet</a>
      <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
      <a href="add-transaction.html" class="btn btn-ghost">Add Transaction</a>
      <span id="userBadge"></span>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>Pick a Category</h2>
      <div id="categories" class="categories-grid">
        <button class="btn category">Food</button>
        <button class="btn category">Transport</button>
        <button class="btn category">Books</button>
        <button class="btn category">Shopping</button>
        <button class="btn category">Other</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pay.js"></script>
</body>
</html>
