<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Allowance Manager | Add Transaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Student Allowance Manager</div>
    <div class="topbar-right">
      <span id="userBadge" class="user-badge"></span>
      <button id="logoutBtn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <a class="nav-link" href="student-dashboard.html">Student Wallet</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link active" href="add-transaction.html">Add Transaction</a>
        <a class="nav-link" href="analytics.html">Analytics</a>
        <a class="nav-link" href="pay.html">Pay</a>
      </nav>
    </aside>

    <main class="content">
      <h1>Add Transaction</h1>
      <p class="subtitle">Record your income or expense in seconds.</p>

      <section class="card form-card">
        <form id="transactionForm" novalidate>
          <div class="form-grid">
            <label>Amount
              <input type="number" id="amount" min="0.01" step="0.01" required placeholder="e.g. 120" />
            </label>
            <label>Category
              <select id="category" required>
                <option value="">Choose category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Books">Books</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Health">Health</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>Description
              <input type="text" id="description" placeholder="Optional details" />
            </label>
            <label>Date
              <input type="date" id="date" required />
            </label>
            <label>Type
              <select id="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Save Transaction</button>
          <p id="transactionMessage" class="message" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/addTransaction.js"></script>
</body>
</html>
