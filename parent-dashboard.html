<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Allowance Manager | Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Student Allowance Manager</div>
    <div class="topbar-right">
      <span id="userBadge" class="user-badge"></span>
      <button id="logoutBtn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <a class="nav-link" href="parent-dashboard.html">Dashboard</a>
        <a class="nav-link" href="analytics.html">Analytics</a>
      </nav>
    </aside>

    <main class="content">
      <h1>Parent Dashboard</h1>

      <section class="card" id="childSelectorCard">
        <h2>Your Students</h2>
        <select id="childSelect"></select>
        <p id="noChildrenMsg" class="message" style="display:none;">No students linked to your account.</p>
      </section>

      <section class="card" id="childSummary" style="display:none;">
        <h3 id="childName"></h3>
        <p>Balance: <span id="childBalance">--</span></p>
        <button id="addMoneyBtn" class="btn btn-primary">Add Funds</button>
      </section>

      <section class="card form-card hidden" id="addMoneyFormCard">
        <h2>Add Funds</h2>
        <form id="addMoneyForm">
          <label>Amount
            <input type="number" id="addMoneyAmount" min="0.01" step="0.01" required />
          </label>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </section>

      <section class="card" id="transactionsCard" style="display:none;">
        <h2>Transactions</h2>
        <div class="table-wrap">
          <table id="transactionsTable">
            <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Type</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="charts-grid" id="chartsSection" style="display:none;">
        <article class="card">
          <h2>Expenses by Category</h2>
          <canvas id="categoryChart" height="200"></canvas>
        </article>
        <article class="card">
          <h2>Monthly Expenses</h2>
          <canvas id="monthlyChart" height="200"></canvas>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/parent-dashboard.js"></script>
</body>
</html>
