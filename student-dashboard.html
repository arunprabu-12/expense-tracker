<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Allowance Manager | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Student Allowance Manager</div>
    <div class="topbar-right">
      <span id="userBadge" class="user-badge"></span>
      <button id="logoutBtn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <a class="nav-link active" href="student-dashboard.html">Dashboard</a>
        <a class="nav-link" href="analytics.html">Analytics</a>
      </nav>
    </aside>

    <main class="content">
      <h1>Student Dashboard</h1>

      <section class="card">
        <h2>Available Balance</h2>
        <p id="balanceValue" class="metric">--</p>
      </section>

      <section class="card form-card">
        <h2>Record an Expense</h2>
        <form id="expenseForm" class="form-grid">
          <label>Category
            <select id="expenseCategory" required>
              <option value="food">Food</option>
              <option value="travel">Travel</option>
              <option value="books">Books</option>
              <option value="shopping">Shopping</option>
              <option value="entertainment">Entertainment</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label>Amount
            <input type="number" id="expenseAmount" min="0.01" step="0.01" required />
          </label>
          <label>Description
            <input type="text" id="expenseDescription" placeholder="Optional" />
          </label>
          <button type="submit" class="btn btn-primary">Add Expense</button>
        </form>
      </section>

      <section class="card">
        <h2>Recent Transactions</h2>
        <div class="table-wrap">
          <table id="transactionsTable">
            <thead>
              <tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="charts-grid">
        <article class="card">
          <h2>Expenses by Category</h2>
          <canvas id="categoryChart" height="200"></canvas>
        </article>
        <article class="card">
          <h2>Monthly Expenses</h2>
          <canvas id="monthlyChart" height="200"></canvas>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/student-dashboard.js"></script>
</body>
</html>
